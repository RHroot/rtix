###################################
# General & Window Settings
###################################
fs=yes                             # Launch fullscreen
keep-open=yes                      # Keep player open at end of video
save-position-on-quit=yes          # Remember playback position
cursor-autohide=1000               # Hide cursor after 1s in fullscreen

###################################
# Subtitle Positioning & Style
###################################
sub-use-margins=yes
sub-pos=103                        # Flush right above bottom edge
sub-margin-y=30

sub-ass-override=scale             # Scale fansubs while keeping custom positions
slang=eng,en
alang=eng,en

sub-font="Noto Sans"
sub-bold=yes
sub-font-size=40
sub-color="#FFE000"                # Bold yellow
sub-border-color="#000000"         # Deep black border
sub-border-size=3.0

sub-shadow-offset=3.0              # Depressed drop shadow
sub-shadow-color="#000000"
sub-back-color="#00000000"         # Transparent background box

sub-auto=fuzzy                     # Load matching external subs

###################################
# Video Output & Rendering
###################################
vo=gpu-next
gpu-api=vulkan                     # Optimal API for NVIDIA on Wayland
hwdec=nvdec-copy                   # Force NVIDIA hardware decoding

tone-mapping=bt.2446a              # Compress HDR highlights for SDR displays
target-colorspace-hint=no

profile=high-quality
scale=ewa_lanczossharp             # Highest quality luma upscaling
cscale=ewa_lanczossharp            # Highest quality chroma upscaling
dscale=mitchell                    # Optimal downscaling

deband=yes                         # Smooth color gradients
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5

target-prim=auto                   # Auto color space
target-trc=auto
video-output-levels=full           # Full RGB range
dither-depth=auto

video-sync=display-resample        # Sync video to monitor refresh rate

###################################
# Audio & Screenshots
###################################
audio-file-auto=fuzzy              # Load matching external audio
volume=140                         # Defaults volume to 140
volume-max=200                     # Allow 200% software boost

screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory="~/Pictures/Screenshots"
